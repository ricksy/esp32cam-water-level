[project]
name = "water-level"
version = "0.1.0"
description = "Water level from an orange float ball seen by an ESP32-CAM"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
]

[project.optional-dependencies]
service = ["paho-mqtt>=2.1"]

[dependency-groups]
dev = [
    "pytest>=8",
]

[project.scripts]
water-level = "water_level.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
