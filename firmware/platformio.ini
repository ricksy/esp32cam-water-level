; ESP32-CAM (AI-Thinker) water level camera.
; Serial:  pio run -t upload --upload-port /dev/ttyUSB0
; OTA:     WATER_TANK_OTA_PASSWORD=... pio run -e ota -t upload
;          (the OTA_PASSWORD from include/secrets.h)

[env]
platform = espressif32@6.9.0
board = esp32cam
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 460800
board_build.partitions = default.csv  ; two OTA app slots

[env:esp32cam]

[env:ota]
upload_protocol = espota
upload_port = water-tank.local
upload_flags = --auth=${sysenv.WATER_TANK_OTA_PASSWORD}
